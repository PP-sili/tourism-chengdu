        productPrice:
          type: number
          format: decimal
        quantity:
          type: integer
        selected:
          type: boolean
        coverImage:
          type: string
        stock:
          type: integer
    AddCartRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
    UpdateCartRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
        selected:
          type: boolean
          nullable: true
    CreateMallOrderRequest:
      type: object
      required: [receiverName, receiverPhone, receiverAddress]
      properties:
        receiverName:
          type: string
          maxLength: 50
        receiverPhone:
          type: string
          pattern: '^1\d{10}$'
        receiverAddress:
          type: string
          maxLength: 255
        remark:
          type: string
          maxLength: 255
        fromCart:
          type: boolean
          description: true 时从购物车已选项合并下单
        items:
          type: array
          items:
            $ref: '#/components/schemas/MallOrderItemRequest'
          description: fromCart=false 时必填
    MallOrderItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
    MallOrderSummaryVO:
      type: object
      properties:
        orderNo:
          type: string
          example: 'SC202607290001'
        totalAmount:
          type: number
          format: decimal
        actualAmount:
          type: number
          format: decimal
        status:
          type: string
          enum: [pending_pay, pending_ship, shipped, received]
          description: |
            pending_pay 待支付
            pending_ship 待发货
            shipped 已发货
            received 已收货
        statusText:
          type: string
          example: '已发货'
        payTime:
          type: string
          format: date-time
          nullable: true
        createTime:
          type: string
          format: date-time
    MallOrderDetailVO:
      allOf:
        - $ref: '#/components/schemas/MallOrderSummaryVO'
        - type: object
          properties:
            receiverName:
              type: string
            receiverPhone:
              type: string
            receiverAddress:
              type: string
            logisticsNo:
              type: string
              nullable: true
              description: 物流单号，后台改库设置
            remark:
              type: string
              nullable: true
            items:
              type: array
              items:
                $ref: '#/components/schemas/MallOrderItemVO'
    MallOrderItemVO:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        productPrice:
          type: number
          format: decimal
        quantity:
          type: integer
        subtotal:
          type: number
          format: decimal
          description: productPrice * quantity
    PageResultEvaluationVO:
      $ref: '#/components/schemas/PageResultTemplate'
      x-items:
        $ref: '#/components/schemas/EvaluationVO'
    PageResultTicketOrderSummaryVO:
      $ref: '#/components/schemas/PageResultTemplate'
      x-items:
        $ref: '#/components/schemas/TicketOrderSummaryVO'
    PageResultPostSummaryVO:
      $ref: '#/components/schemas/PageResultTemplate'
      x-items:
        $ref: '#/components/schemas/PostSummaryVO'
    PageResultProductSummaryVO:
      $ref: '#/components/schemas/PageResultTemplate'
      x-items:
        $ref: '#/components/schemas/ProductSummaryVO'
    PageResultMallOrderSummaryVO:
      $ref: '#/components/schemas/PageResultTemplate'
      x-items:
        $ref: '#/components/schemas/MallOrderSummaryVO'
    PageResultTemplate:
      type: object
      properties:
        list:
          type: array
          items: {}
        total:
          type: integer
          format: int64
        page:
          type: integer
        size:
          type: integer
