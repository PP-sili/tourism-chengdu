      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          pattern: '^1\d{10}$'
          example: '13800001111'
          description: 手机号
        password:
          type: string
          minLength: 6
          maxLength: 20
          example: '123456'
          description: 密码，6-20 位
        nickname:
          type: string
          maxLength: 50
          example: '熊猫爱好者'
          description: 昵称（可选）
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT Token，后续请求携带 Authorization: Bearer {token}
        tokenType:
          type: string
          default: Bearer
        user:
          $ref: '#/components/schemas/UserProfileVO'
    UserProfileVO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        phone:
          type: string
          example: '13800001111'
        nickname:
          type: string
          example: '熊猫爱好者'
        avatar:
          type: string
