    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          pattern: '^1\d{10}$'
          example: '13800001111'
          description: 手机号，11 位
        password:
          type: string
          example: '123456'
          description: 密码
