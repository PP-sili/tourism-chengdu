openapi: 3.0.3
info:
  title: 成都文旅景点导览与票务系统 API
  description: |
    成都文旅后端 REST API 文档（供鸿蒙端对接）
    - Base URL: http://localhost:8082
    - Content-Type: application/json（上传接口除外）
    - 在线 Swagger UI: http://localhost:8082/swagger-ui.html
    - 除公开接口外，请在请求头携带：Authorization: Bearer {token}
  version: 1.0.0
  contact:
    name: tourism-chengdu
    email: dev@example.com
servers:
  - url: http://localhost:8082
    description: 本地开发环境
tags:
  - name: 系统
    description: 健康检查
  - name: 认证
    description: 注册与登录
  - name: 用户
    description: 个人资料与我的页汇总
  - name: 首页
    description: 轮播图
  - name: 景点
    description: 景点列表、详情与统计
  - name: 景点评价
    description: 好评/差评/建议类评价
  - name: 天气
    description: 成都天气（Redis 缓存）
  - name: 门票订单
    description: 预约购票、支付、退票
  - name: 行程
    description: 自动生成行程与手动调整
  - name: 上传
    description: 图片上传（头像、帖子）
  - name: 社区
    description: 发帖、浏览、点赞
  - name: 商城-商品
    description: 纪念品浏览
  - name: 商城-购物车
    description: 购物车管理
  - name: 商城-订单
    description: 合并下单、支付、物流
paths:
  /api/health:
    get:
      tags: [系统]
      summary: 健康检查
      description: 公开接口，无需登录
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultMapStringString'
  /api/auth/register:
    post:
      tags: [认证]
      summary: 注册
      description: 手机号+密码+可选昵称，公开接口
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 成功，返回 token 和用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/login:
    post:
      tags: [认证]
      summary: 登录
      description: 手机号+密码，公开接口
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 成功，返回 JWT 和用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/user/profile:
    get:
      tags: [用户]
      summary: 获取个人资料
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserProfileVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [用户]
      summary: 更新昵称/头像
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserProfileVO'
  /api/user/avatar:
    put:
      tags: [用户]
      summary: 更新头像 URL
      description: URL 必须以 /uploads/ 开头
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAvatarRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserProfileVO'
  /api/user/like-stats:
    get:
      tags: [用户]
      summary: 我的帖子获赞总数
      description: 只统计帖子被点赞数，与景点评价无关
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserLikeStatsVO'
  /api/user/overview:
    get:
      tags: [用户]
      summary: 我的页汇总
      description: 资料+订单统计+购物车+帖子
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserOverviewVO'
  /api/banners:
    get:
      tags: [首页]
      summary: 轮播图列表
      description: 公开接口
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultListBannerVO'
  /api/scenes:
    get:
      tags: [景点]
      summary: 景点列表
      description: 公开接口，票价为 0 的景点 bookable=false，不可预约
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultListSceneListVO'
  /api/scenes/{id}:
    get:
      tags: [景点]
      summary: 景点详情
      description: 公开接口
      security: []
      parameters:
        - $ref: '#/components/parameters/SceneIdPath'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultSceneDetailVO'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/scenes/{id}/visitor-stats:
    get:
      tags: [景点]
      summary: 近 7 日人流统计
      description: 公开接口
      security: []
      parameters:
        - $ref: '#/components/parameters/SceneIdPath'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultListVisitorStatItemVO'
  /api/scenes/{id}/ticket-stats:
    get:
      tags: [景点]
      summary: 近 7 日余票统计
      description: 公开接口
      security: []
      parameters:
        - $ref: '#/components/parameters/SceneIdPath'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultListTicketStatItemVO'
  /api/scenes/{id}/evaluations:
    get:
      tags: [景点]
      summary: 景点评价列表
      description: 公开接口
      security: []
      parameters:
        - $ref: '#/components/parameters/SceneIdPath'
        - name: type
          in: query
          schema:
            type: string
            default: all
            enum: [all, good, bad, suggestion]
          description: 评价类型筛选
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPageResultEvaluationVO'
  /api/scenes/{id}/evaluation-summary:
    get:
      tags: [景点]
      summary: 景点评价统计
      description: 公开接口，好评/差评/建议数量
      security: []
      parameters:
        - $ref: '#/components/parameters/SceneIdPath'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEvaluationSummaryVO'
  /api/scenes/{id}/available-dates:
    get:
      tags: [门票订单]
      summary: 可预约日期与余票
      description: 公开接口
      security: []
      parameters:
        - $ref: '#/components/parameters/SceneIdPath'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAvailableDatesVO'
  /api/ticket/visit-slots:
    get:
      tags: [门票订单]
      summary: 游玩时段列表
      description: 返回所有可用时段编码和名称
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultListVisitSlotVO'
  /api/ticket/orders:
    post:
      tags: [门票订单]
      summary: 创建门票订单
      description: 多票种+每人身份证
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketOrderRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultTicketOrderDetailVO'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [门票订单]
      summary: 门票订单列表
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending_pay, pending_use, used, refunded]
          description: 订单状态筛选（可选）
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPageResultTicketOrderSummaryVO'
  /api/ticket/orders/{orderNo}:
    get:
      tags: [门票订单]
      summary: 门票订单详情
      description: 含每张票独立 qr_code
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderNoPath'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultTicketOrderDetailVO'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/ticket/orders/{orderNo}/pay:
    post:
      tags: [门票订单]
      summary: 模拟支付门票订单
      description: 调用即支付成功
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderNoPath'
      responses:
        '200':
          description: 成功，支付后行程自动生成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultTicketOrderDetailVO'
  /api/ticket/orders/{orderNo}/refund:
    post:
      tags: [门票订单]
      summary: 门票退票
      description: 退票截止：游玩日前一日 20:00
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderNoPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundTicketOrderRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultTicketOrderDetailVO'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/evaluations:
    post:
      tags: [景点评价]
      summary: 发表评价
      description: 每个用户对每个景点只能评价1次；收费景点需有已支付门票且游玩日期≤今天
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvaluationRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEvaluationVO'
  /api/evaluations/mine:
    get:
      tags: [景点评价]
      summary: 我的评价列表
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPageResultEvaluationVO'
  /api/evaluations/can-evaluate:
    get:
      tags: [景点评价]
      summary: 检查是否可评价该景点
      security:
        - BearerAuth: []
      parameters:
        - name: sceneId
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: 景点 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCanEvaluateVO'
  /api/itinerary:
    get:
      tags: [行程]
      summary: 行程列表（按日期分组）
      description: 门票支付成功后后端自动生成，无手动创建接口
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultListItineraryDayVO'
  /api/itinerary/{date}:
    put:
      tags: [行程]
      summary: 更新某天行程排序与备注
      security:
        - BearerAuth: []
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
            example: '2026-07-30'
          description: 行程日期 (YYYY-MM-DD)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItineraryRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultItineraryDayVO'
  /api/upload/image:
    post:
      tags: [上传]
      summary: 上传图片
      description: multipart/form-data，字段名 file，最大 5MB。返回 URL 以 /uploads/ 开头
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 图片文件（jpeg/png/webp/gif）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUploadImageVO'
  /api/posts:
    post:
      tags: [社区]
      summary: 发帖
      description: 最多 9 图，可选 sceneId 关联景点
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPostDetailVO'
    get:
      tags: [社区]
      summary: 帖子列表
      description: 热度算法：like_count * 2 + view_count
      security:
        - BearerAuth: []
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            default: time
            enum: [time, hot]
          description: 排序方式：time 按时间 / hot 按热度
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPageResultPostSummaryVO'
  /api/posts/mine:
    get:
      tags: [社区]
      summary: 我的帖子列表
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPageResultPostSummaryVO'
  /api/posts/{id}:
    get:
      tags: [社区]
      summary: 帖子详情
      description: 浏览量+1，无评论功能
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPostDetailVO'
  /api/posts/{id}/like:
    post:
      tags: [社区]
      summary: 点赞/取消点赞
      description: 切换点赞状态
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPostLikeResultVO'
  /api/products:
    get:
      tags: [商城-商品]
      summary: 商品列表
      description: 公开接口
      security: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: 分类筛选（可选）
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPageResultProductSummaryVO'
  /api/products/{id}:
    get:
      tags: [商城-商品]
      summary: 商品详情
      description: 公开接口
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultProductDetailVO'
  /api/cart:
    get:
      tags: [商城-购物车]
      summary: 购物车列表
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultListCartItemVO'
    post:
      tags: [商城-购物车]
      summary: 加入购物车
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCartItemVO'
  /api/cart/{id}:
    put:
      tags: [商城-购物车]
      summary: 修改购物车项数量/选中
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 购物车项 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCartItemVO'
    delete:
      tags: [商城-购物车]
      summary: 删除购物车项
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 购物车项 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
  /api/mall/orders:
    post:
      tags: [商城-订单]
      summary: 创建商城订单（合并下单）
      description: fromCart=true 时从已选中购物车项下单，否则使用 items 字段
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMallOrderRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultMallOrderDetailVO'
    get:
      tags: [商城-订单]
      summary: 商城订单列表
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending_pay, pending_ship, shipped, received]
          description: 状态筛选（可选）
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPageResultMallOrderSummaryVO'
  /api/mall/orders/{orderNo}:
    get:
      tags: [商城-订单]
      summary: 商城订单详情（含物流）
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderNoPath'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultMallOrderDetailVO'
  /api/mall/orders/{orderNo}/pay:
    post:
      tags: [商城-订单]
      summary: 模拟支付商城订单
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderNoPath'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultMallOrderDetailVO'
  /api/weather/chengdu:
    get:
      tags: [天气]
      summary: 成都天气
      description: 公开接口，Redis 缓存 30 分钟
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultWeatherVO'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 登录接口返回的 token，请求头格式：Authorization: Bearer {token}
  parameters:
    SceneIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 景点 ID
    PostIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 帖子 ID
    ProductIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 商品 ID
    OrderNoPath:
      name: orderNo
      in: path
      required: true
      schema:
        type: string
      description: 订单号
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: 页码，从 1 开始
    Size:
      name: size
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 50
      description: 每页条数，最大 50
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
          example:
            code: 400
            message: 请求参数错误
            data: null
    Unauthorized:
      description: 未登录或登录已过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
          example:
            code: 401
            message: 未登录或登录已过期
            data: null
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
          example:
            code: 404
            message: 资源不存在
            data: null
  schemas:
    ResultVoid:
      type: object
      properties:
        code:
          type: integer
          example: 200
          enum: [200, 400, 401, 403, 404, 409, 500]
          description: |
            状态码：
            - 200 成功
            - 400 请求参数错误
            - 401 未登录或登录已过期
            - 403 无权限
            - 404 资源不存在
            - 409 资源冲突
            - 500 服务器内部错误
        message:
          type: string
          example: success
        data:
          type: object
          nullable: true
      required: [code, message]
